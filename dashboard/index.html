<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MDHuntFishOutdoors Analytics Dashboard</title>

  <!-- FastAPI Routing Note:
       Add this to your FastAPI app to serve this dashboard:

       from fastapi.staticfiles import StaticFiles
       from fastapi.responses import FileResponse

       app.mount("/dashboard", StaticFiles(directory="dashboard", html=True), name="dashboard")

       Or create a route:
       @app.get("/dashboard")
       async def serve_dashboard():
           return FileResponse("dashboard/index.html")
  -->

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1e16;
      color: #c4a882;
      line-height: 1.6;
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 2px solid #4a6741;
      padding-bottom: 20px;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .header-title h1 {
      font-size: 28px;
      font-weight: 600;
      color: #a89968;
    }

    .md-flag {
      display: flex;
      gap: 2px;
      height: 24px;
    }

    .md-flag-stripe {
      width: 8px;
      height: 100%;
      border-radius: 2px;
    }

    .stripe-red { background: #8b4513; }
    .stripe-gold { background: #a89968; }
    .stripe-black { background: #242b1e; }
    .stripe-white { background: #e8e6d1; }

    .header-controls {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .api-config {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .api-config input {
      padding: 8px 12px;
      background: #242b1e;
      border: 1px solid #4a6741;
      color: #c4a882;
      border-radius: 4px;
      font-size: 14px;
      min-width: 250px;
    }

    .api-config input::placeholder {
      color: #6b7b5f;
    }

    .api-config input:focus {
      outline: none;
      border-color: #a89968;
      background: #2d3626;
    }

    .toggle-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .toggle-switch {
      position: relative;
      width: 50px;
      height: 24px;
      background: #242b1e;
      border-radius: 12px;
      cursor: pointer;
      border: 1px solid #4a6741;
      transition: all 0.3s ease;
    }

    .toggle-switch.active {
      background: #4a6741;
      border-color: #6b8c5f;
    }

    .toggle-switch::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: #a89968;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: left 0.3s ease;
    }

    .toggle-switch.active::after {
      left: 28px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #6b7b5f;
      margin-bottom: 20px;
    }

    .status-indicator {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4a6741;
    }

    .status-dot.loading {
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      border-bottom: 1px solid #242b1e;
    }

    .tab-btn {
      padding: 12px 20px;
      background: none;
      border: none;
      color: #6b7b5f;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      border-bottom: 3px solid transparent;
      transition: all 0.3s ease;
    }

    .tab-btn:hover {
      color: #a89968;
    }

    .tab-btn.active {
      color: #a89968;
      border-bottom-color: #a89968;
    }

    /* Content */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* KPI Cards */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    .kpi-card {
      background: #242b1e;
      border: 1px solid #4a6741;
      border-radius: 8px;
      padding: 20px;
      transition: all 0.3s ease;
    }

    .kpi-card:hover {
      border-color: #6b8c5f;
      background: #2d3626;
    }

    .kpi-label {
      font-size: 12px;
      color: #6b7b5f;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .kpi-value {
      font-size: 32px;
      font-weight: 700;
      color: #a89968;
    }

    .kpi-change {
      font-size: 12px;
      color: #4a6741;
      margin-top: 8px;
    }

    /* Charts */
    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .chart-container {
      background: #242b1e;
      border: 1px solid #4a6741;
      border-radius: 8px;
      padding: 20px;
      min-height: 300px;
    }

    .chart-title {
      font-size: 14px;
      font-weight: 600;
      color: #a89968;
      margin-bottom: 15px;
    }

    .chart-wrapper {
      position: relative;
      height: 250px;
    }

    /* Tables */
    .table-container {
      background: #242b1e;
      border: 1px solid #4a6741;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 30px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    table thead {
      border-bottom: 2px solid #4a6741;
    }

    table th {
      padding: 12px;
      text-align: left;
      color: #a89968;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    table td {
      padding: 12px;
      border-bottom: 1px solid #1a1e16;
      color: #c4a882;
    }

    table tr:hover {
      background: #2d3626;
    }

    .rank-badge {
      display: inline-block;
      background: #4a6741;
      color: #e8e6d1;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      text-align: center;
      line-height: 28px;
      font-weight: 600;
      font-size: 11px;
    }

    .amazon-link {
      color: #a89968;
      text-decoration: none;
      cursor: pointer;
    }

    .amazon-link:hover {
      text-decoration: underline;
    }

    /* Loading State */
    .loading {
      text-align: center;
      padding: 40px;
      color: #6b7b5f;
    }

    .spinner {
      display: inline-block;
      width: 30px;
      height: 30px;
      border: 3px solid #4a6741;
      border-top-color: #a89968;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Error State */
    .error-message {
      background: #2d3626;
      border: 1px solid #8b4513;
      color: #e8a868;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 20px;
    }

    /* Data Import */
    .import-section {
      background: #242b1e;
      border: 1px solid #4a6741;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 30px;
    }

    .import-section h3 {
      color: #a89968;
      margin-bottom: 15px;
      font-size: 14px;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      padding: 12px;
      background: #1a1e16;
      border: 1px solid #4a6741;
      color: #c4a882;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      margin-bottom: 10px;
      resize: vertical;
    }

    textarea:focus {
      outline: none;
      border-color: #a89968;
    }

    .button-group {
      display: flex;
      gap: 10px;
    }

    button {
      padding: 10px 20px;
      background: #4a6741;
      color: #e8e6d1;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    button:hover {
      background: #5a7b51;
    }

    button:active {
      opacity: 0.8;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .charts-grid {
        grid-template-columns: 1fr;
      }

      .kpi-row {
        grid-template-columns: repeat(2, 1fr);
      }

      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }

      .header-controls {
        flex-direction: column;
        width: 100%;
        gap: 10px;
      }

      .api-config {
        width: 100%;
      }

      .api-config input {
        min-width: 100%;
      }
    }

    @media (max-width: 640px) {
      .container {
        padding: 10px;
      }

      .kpi-row {
        grid-template-columns: 1fr;
      }

      .header-title h1 {
        font-size: 20px;
      }

      table {
        font-size: 12px;
      }

      table th, table td {
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Color theme for charts
    const CHART_COLORS = {
      primary: '#a89968',
      accent: '#4a6741',
      secondary: '#6b8c5f',
      background: '#242b1e',
      grid: '#4a6741',
      hunt: '#8b4513',
      fish: '#6b8c9f',
      camp: '#8b7355',
      hike: '#6b8c5f',
    };

    // Activity mode colors
    const MODE_COLORS = {
      hunt: '#8b4513',
      fish: '#6b8c9f',
      camp: '#8b7355',
      hike: '#6b8c5f',
    };

    function Dashboard() {
      const [apiUrl, setApiUrl] = useState(() => {
        // If opened as a local file or on a different host, default to the Render backend
        const origin = window.location.origin;
        if (!origin || origin === 'null' || origin.startsWith('file://')) {
          return 'https://huntplan-api.onrender.com';
        }
        return origin;
      });
      const [autoRefresh, setAutoRefresh] = useState(false);
      const [activeTab, setActiveTab] = useState('overview');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [lastUpdated, setLastUpdated] = useState(null);

      // Data states
      const [overviewData, setOverviewData] = useState(null);
      const [affiliateData, setAffiliateData] = useState(null);
      const [retentionData, setRetentionData] = useState(null);
      const [errorData, setErrorData] = useState(null);
      const [engagementData, setEngagementData] = useState(null);
      const [downloadData, setDownloadData] = useState(null);

      const chartRefsOverview = useRef({});
      const chartRefsAffiliate = useRef({});
      const chartRefsRetention = useRef({});
      const chartRefsError = useRef({});
      const chartRefsEngagement = useRef({});
      const chartRefsDownload = useRef({});

      const refreshIntervalRef = useRef(null);

      const fetchData = async () => {
        setLoading(true);
        setError(null);

        try {
          // Fetch all endpoints
          const endpoints = [
            ['overview', '/api/v1/analytics/dashboard'],
            ['affiliate', '/api/v1/analytics/affiliate'],
            ['retention', '/api/v1/analytics/retention'],
            ['errors', '/api/v1/analytics/errors'],
            ['engagement', '/api/v1/analytics/engagement'],
          ];

          for (const [key, endpoint] of endpoints) {
            const response = await fetch(`${apiUrl}${endpoint}`);
            if (!response.ok) throw new Error(`Failed to fetch ${endpoint}`);
            const data = await response.json();

            if (key === 'overview') setOverviewData(data);
            else if (key === 'affiliate') setAffiliateData(data);
            else if (key === 'retention') setRetentionData(data);
            else if (key === 'errors') setErrorData(data);
            else if (key === 'engagement') setEngagementData(data);
          }

          setLastUpdated(new Date());
        } catch (err) {
          setError(`Error fetching data: ${err.message}`);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchData();
      }, [apiUrl]);

      useEffect(() => {
        if (autoRefresh) {
          refreshIntervalRef.current = setInterval(fetchData, 30000);
          return () => clearInterval(refreshIntervalRef.current);
        }
      }, [autoRefresh, apiUrl]);

      useEffect(() => {
        if (activeTab === 'overview' && overviewData) renderOverviewCharts();
        else if (activeTab === 'affiliate' && affiliateData) renderAffiliateCharts();
        else if (activeTab === 'retention' && retentionData) renderRetentionCharts();
        else if (activeTab === 'errors' && errorData) renderErrorCharts();
        else if (activeTab === 'engagement' && engagementData) renderEngagementCharts();
      }, [activeTab, overviewData, affiliateData, retentionData, errorData, engagementData]);

      const renderOverviewCharts = () => {
        if (!overviewData) return;

        // Hourly events chart
        const hourlyCtx = document.getElementById('hourlyChart');
        if (hourlyCtx && overviewData.hourly_events) {
          if (chartRefsOverview.current.hourly) chartRefsOverview.current.hourly.destroy();
          chartRefsOverview.current.hourly = new Chart(hourlyCtx, {
            type: 'line',
            data: {
              labels: overviewData.hourly_events.map(h => `${h.hour}:00`),
              datasets: [{
                label: 'Events',
                data: overviewData.hourly_events.map(h => h.count),
                borderColor: CHART_COLORS.primary,
                backgroundColor: 'rgba(168, 153, 104, 0.1)',
                tension: 0.4,
                fill: true,
              }],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                y: { grid: { color: CHART_COLORS.grid }, ticks: { color: CHART_COLORS.primary } },
                x: { grid: { display: false }, ticks: { color: CHART_COLORS.primary } },
              },
            },
          });
        }

        // Activity mode donut
        const modeCtx = document.getElementById('modeChart');
        if (modeCtx && overviewData.activity_mode_breakdown) {
          if (chartRefsOverview.current.mode) chartRefsOverview.current.mode.destroy();
          const modes = overviewData.activity_mode_breakdown;
          chartRefsOverview.current.mode = new Chart(modeCtx, {
            type: 'doughnut',
            data: {
              labels: Object.keys(modes).map(k => k.charAt(0).toUpperCase() + k.slice(1)),
              datasets: [{
                data: Object.values(modes),
                backgroundColor: Object.keys(modes).map(k => MODE_COLORS[k]),
              }],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { labels: { color: CHART_COLORS.primary } } },
            },
          });
        }

        // Top screens bar
        const screensCtx = document.getElementById('screensChart');
        if (screensCtx && overviewData.top_screens) {
          if (chartRefsOverview.current.screens) chartRefsOverview.current.screens.destroy();
          chartRefsOverview.current.screens = new Chart(screensCtx, {
            type: 'bar',
            data: {
              labels: overviewData.top_screens.slice(0, 10).map(s => s.screen_name),
              datasets: [{
                label: 'Views',
                data: overviewData.top_screens.slice(0, 10).map(s => s.count),
                backgroundColor: CHART_COLORS.accent,
              }],
            },
            options: {
              indexAxis: 'y',
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { grid: { color: CHART_COLORS.grid }, ticks: { color: CHART_COLORS.primary } },
                y: { grid: { display: false }, ticks: { color: CHART_COLORS.primary } },
              },
            },
          });
        }

        // Top features bar
        const featuresCtx = document.getElementById('featuresChart');
        if (featuresCtx && overviewData.top_features) {
          if (chartRefsOverview.current.features) chartRefsOverview.current.features.destroy();
          chartRefsOverview.current.features = new Chart(featuresCtx, {
            type: 'bar',
            data: {
              labels: overviewData.top_features.slice(0, 10).map(f => f.feature),
              datasets: [{
                label: 'Usage',
                data: overviewData.top_features.slice(0, 10).map(f => f.count),
                backgroundColor: CHART_COLORS.secondary,
              }],
            },
            options: {
              indexAxis: 'y',
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { grid: { color: CHART_COLORS.grid }, ticks: { color: CHART_COLORS.primary } },
                y: { grid: { display: false }, ticks: { color: CHART_COLORS.primary } },
              },
            },
          });
        }
      };

      const renderAffiliateCharts = () => {
        if (!affiliateData) return;

        // Daily clicks line chart
        const dailyCtx = document.getElementById('dailyClicksChart');
        if (dailyCtx && affiliateData.clicks_by_day) {
          if (chartRefsAffiliate.current.daily) chartRefsAffiliate.current.daily.destroy();
          chartRefsAffiliate.current.daily = new Chart(dailyCtx, {
            type: 'line',
            data: {
              labels: affiliateData.clicks_by_day.map(d => d.date),
              datasets: [{
                label: 'Clicks',
                data: affiliateData.clicks_by_day.map(d => d.count),
                borderColor: CHART_COLORS.primary,
                backgroundColor: 'rgba(168, 153, 104, 0.1)',
                tension: 0.4,
                fill: true,
              }],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                y: { grid: { color: CHART_COLORS.grid }, ticks: { color: CHART_COLORS.primary } },
                x: { grid: { display: false }, ticks: { color: CHART_COLORS.primary } },
              },
            },
          });
        }

        // Top products bar
        const productsCtx = document.getElementById('topProductsChart');
        if (productsCtx && affiliateData.top_products) {
          if (chartRefsAffiliate.current.products) chartRefsAffiliate.current.products.destroy();
          const topProducts = affiliateData.top_products.slice(0, 15);
          chartRefsAffiliate.current.products = new Chart(productsCtx, {
            type: 'bar',
            data: {
              labels: topProducts.map(p => p.product_name),
              datasets: [{
                label: 'Clicks',
                data: topProducts.map(p => p.click_count),
                backgroundColor: CHART_COLORS.accent,
              }],
            },
            options: {
              indexAxis: 'y',
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                x: { grid: { color: CHART_COLORS.grid }, ticks: { color: CHART_COLORS.primary } },
                y: { grid: { display: false }, ticks: { color: CHART_COLORS.primary } },
              },
            },
          });
        }

        // Category donut
        const categoryCtx = document.getElementById('categoriesChart');
        if (categoryCtx && affiliateData.clicks_by_category) {
          if (chartRefsAffiliate.current.category) chartRefsAffiliate.current.category.destroy();
          const cats = affiliateData.clicks_by_category;
          chartRefsAffiliate.current.category = new Chart(categoryCtx, {
            type: 'doughnut',
            data: {
              labels: Object.keys(cats),
              datasets: [{
                data: Object.values(cats),
                backgroundColor: [
                  '#8b4513', '#6b8c5f', '#6b8c9f', '#8b7355',
                  '#a89968', '#4a6741', '#8b6b47', '#5a7b51'
                ],
              }],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { labels: { color: CHART_COLORS.primary } } },
            },
          });
        }
      };

      const renderRetentionCharts = () => {
        if (!retentionData) return;

        // New vs Returning stacked bar
        const devicesCtx = document.getElementById('devicesChart');
        if (devicesCtx && retentionData.devices_by_day) {
          if (chartRefsRetention.current.devices) chartRefsRetention.current.devices.destroy();
          chartRefsRetention.current.devices = new Chart(devicesCtx, {
            type: 'bar',
            data: {
              labels: retentionData.devices_by_day.map(d => d.date),
              datasets: [
                {
                  label: 'New Devices',
                  data: retentionData.devices_by_day.map(d => d.new_devices),
                  backgroundColor: CHART_COLORS.primary,
                },
                {
                  label: 'Returning',
                  data: retentionData.devices_by_day.map(d => d.returning_devices),
                  backgroundColor: CHART_COLORS.secondary,
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                x: { stacked: true, grid: { display: false }, ticks: { color: CHART_COLORS.primary } },
                y: { stacked: true, grid: { color: CHART_COLORS.grid }, ticks: { color: CHART_COLORS.primary } },
              },
              plugins: { legend: { labels: { color: CHART_COLORS.primary } } },
            },
          });
        }

        // Session depth donut
        const sessionCtx = document.getElementById('sessionChart');
        if (sessionCtx && retentionData.session_count_distribution) {
          if (chartRefsRetention.current.session) chartRefsRetention.current.session.destroy();
          const dist = retentionData.session_count_distribution;
          chartRefsRetention.current.session = new Chart(sessionCtx, {
            type: 'doughnut',
            data: {
              labels: ['1 Session', '2-5 Sessions', '6-10 Sessions', '11+ Sessions'],
              datasets: [{
                data: [dist.sessions_1, dist.sessions_2_5, dist.sessions_6_10, dist.sessions_11_plus],
                backgroundColor: [CHART_COLORS.primary, CHART_COLORS.accent, CHART_COLORS.secondary, '#8b4513'],
              }],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { labels: { color: CHART_COLORS.primary } } },
            },
          });
        }
      };

      const renderErrorCharts = () => {
        if (!errorData) return;

        // Daily errors line
        const errorsCtx = document.getElementById('errorsChart');
        if (errorsCtx && errorData.errors_by_day) {
          if (chartRefsError.current.errors) chartRefsError.current.errors.destroy();
          chartRefsError.current.errors = new Chart(errorsCtx, {
            type: 'line',
            data: {
              labels: errorData.errors_by_day.map(d => d.date),
              datasets: [{
                label: 'Errors',
                data: errorData.errors_by_day.map(d => d.count),
                borderColor: '#8b4513',
                backgroundColor: 'rgba(139, 69, 19, 0.1)',
                tension: 0.4,
                fill: true,
              }],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                y: { grid: { color: CHART_COLORS.grid }, ticks: { color: CHART_COLORS.primary } },
                x: { grid: { display: false }, ticks: { color: CHART_COLORS.primary } },
              },
            },
          });
        }
      };

      const renderEngagementCharts = () => {
        if (!engagementData) return;

        // Plans by type
        const plansCtx = document.getElementById('plansChart');
        if (plansCtx && engagementData.plans_by_type) {
          if (chartRefsEngagement.current.plans) chartRefsEngagement.current.plans.destroy();
          const plans = engagementData.plans_by_type;
          chartRefsEngagement.current.plans = new Chart(plansCtx, {
            type: 'bar',
            data: {
              labels: Object.keys(plans),
              datasets: [{
                label: 'Plans',
                data: Object.values(plans),
                backgroundColor: CHART_COLORS.accent,
              }],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                y: { grid: { color: CHART_COLORS.grid }, ticks: { color: CHART_COLORS.primary } },
                x: { grid: { display: false }, ticks: { color: CHART_COLORS.primary } },
              },
            },
          });
        }

        // Trips by type
        const tripsCtx = document.getElementById('tripsChart');
        if (tripsCtx && engagementData.trips_by_type) {
          if (chartRefsEngagement.current.trips) chartRefsEngagement.current.trips.destroy();
          const trips = engagementData.trips_by_type;
          chartRefsEngagement.current.trips = new Chart(tripsCtx, {
            type: 'bar',
            data: {
              labels: Object.keys(trips),
              datasets: [{
                label: 'Trips',
                data: Object.values(trips),
                backgroundColor: CHART_COLORS.secondary,
              }],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { display: false } },
              scales: {
                y: { grid: { color: CHART_COLORS.grid }, ticks: { color: CHART_COLORS.primary } },
                x: { grid: { display: false }, ticks: { color: CHART_COLORS.primary } },
              },
            },
          });
        }
      };

      return (
        <div className="container">
          {/* Header */}
          <div className="header">
            <div className="header-title">
              <h1>MDHuntFishOutdoors Analytics</h1>
              <div className="md-flag">
                <div className="md-flag-stripe stripe-red"></div>
                <div className="md-flag-stripe stripe-gold"></div>
                <div className="md-flag-stripe stripe-black"></div>
                <div className="md-flag-stripe stripe-white"></div>
              </div>
            </div>
            <div className="header-controls">
              <div className="api-config">
                <label style={{fontSize: '12px', color: '#6b7b5f'}}>API URL:</label>
                <input
                  type="text"
                  value={apiUrl}
                  onChange={(e) => setApiUrl(e.target.value)}
                  placeholder="http://localhost:8000"
                />
              </div>
              <div className="toggle-group">
                <label style={{fontSize: '12px', color: '#6b7b5f'}}>Auto-refresh:</label>
                <div
                  className={`toggle-switch ${autoRefresh ? 'active' : ''}`}
                  onClick={() => setAutoRefresh(!autoRefresh)}
                ></div>
              </div>
              <button onClick={fetchData} disabled={loading}>
                {loading ? 'Loading...' : 'Refresh'}
              </button>
            </div>
          </div>

          {/* Status Bar */}
          <div className="status-bar">
            <div className="status-indicator">
              <div className={`status-dot ${loading ? 'loading' : ''}`}></div>
              <span>{loading ? 'Fetching data...' : 'Ready'}</span>
            </div>
            {lastUpdated && (
              <span>Last Updated: {lastUpdated.toLocaleTimeString()}</span>
            )}
          </div>

          {/* Error Message */}
          {error && <div className="error-message">{error}</div>}

          {/* Tabs */}
          <div className="tabs">
            {['Overview', 'Affiliate', 'Engagement', 'Retention', 'Errors', 'Downloads'].map(tab => (
              <button
                key={tab.toLowerCase()}
                className={`tab-btn ${activeTab === tab.toLowerCase() ? 'active' : ''}`}
                onClick={() => setActiveTab(tab.toLowerCase())}
              >
                {tab}
              </button>
            ))}
          </div>

          {/* Overview Tab */}
          <div className={`tab-content ${activeTab === 'overview' ? 'active' : ''}`}>
            {overviewData ? (
              <>
                <div className="kpi-row">
                  <div className="kpi-card">
                    <div className="kpi-label">Total Events</div>
                    <div className="kpi-value">{overviewData.total_events?.toLocaleString() || '—'}</div>
                  </div>
                  <div className="kpi-card">
                    <div className="kpi-label">Unique Devices</div>
                    <div className="kpi-value">{overviewData.unique_devices?.toLocaleString() || '—'}</div>
                  </div>
                  <div className="kpi-card">
                    <div className="kpi-label">Daily Active Users</div>
                    <div className="kpi-value">{overviewData.dau?.toLocaleString() || '—'}</div>
                  </div>
                  <div className="kpi-card">
                    <div className="kpi-label">Weekly Active Users</div>
                    <div className="kpi-value">{overviewData.wau?.toLocaleString() || '—'}</div>
                  </div>
                  <div className="kpi-card">
                    <div className="kpi-label">Monthly Active Users</div>
                    <div className="kpi-value">{overviewData.mau?.toLocaleString() || '—'}</div>
                  </div>
                </div>

                <div className="charts-grid">
                  <div className="chart-container">
                    <div className="chart-title">Hourly Events (48h)</div>
                    <div className="chart-wrapper"><canvas id="hourlyChart"></canvas></div>
                  </div>
                  <div className="chart-container">
                    <div className="chart-title">Activity Mode Breakdown</div>
                    <div className="chart-wrapper"><canvas id="modeChart"></canvas></div>
                  </div>
                  <div className="chart-container">
                    <div className="chart-title">Top 10 Screens</div>
                    <div className="chart-wrapper"><canvas id="screensChart"></canvas></div>
                  </div>
                  <div className="chart-container">
                    <div className="chart-title">Top 10 Features</div>
                    <div className="chart-wrapper"><canvas id="featuresChart"></canvas></div>
                  </div>
                </div>

                {overviewData.version_breakdown && (
                  <div className="table-container">
                    <div className="chart-title" style={{marginBottom: '15px'}}>App Version Breakdown</div>
                    <table>
                      <thead>
                        <tr>
                          <th>Version</th>
                          <th>Count</th>
                        </tr>
                      </thead>
                      <tbody>
                        {Object.entries(overviewData.version_breakdown).map(([version, count]) => (
                          <tr key={version}>
                            <td>{version}</td>
                            <td>{count.toLocaleString()}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </>
            ) : <div className="loading"><div className="spinner"></div></div>}
          </div>

          {/* Affiliate Tab */}
          <div className={`tab-content ${activeTab === 'affiliate' ? 'active' : ''}`}>
            {affiliateData ? (
              <>
                <div className="kpi-row">
                  <div className="kpi-card">
                    <div className="kpi-label">Total Clicks</div>
                    <div className="kpi-value">{affiliateData.total_clicks?.toLocaleString() || '—'}</div>
                  </div>
                  <div className="kpi-card">
                    <div className="kpi-label">Clicks Today</div>
                    <div className="kpi-value">{affiliateData.clicks_today?.toLocaleString() || '—'}</div>
                  </div>
                  <div className="kpi-card">
                    <div className="kpi-label">Est. Revenue</div>
                    <div className="kpi-value">${affiliateData.estimated_revenue?.toFixed(2) || '—'}</div>
                  </div>
                </div>

                <div className="charts-grid">
                  <div className="chart-container" style={{gridColumn: '1 / -1'}}>
                    <div className="chart-title">Daily Clicks (30 Days)</div>
                    <div className="chart-wrapper" style={{height: '300px'}}><canvas id="dailyClicksChart"></canvas></div>
                  </div>
                  <div className="chart-container" style={{gridColumn: '1 / -1'}}>
                    <div className="chart-title">Top 15 Products by Clicks</div>
                    <div className="chart-wrapper" style={{height: '400px'}}><canvas id="topProductsChart"></canvas></div>
                  </div>
                  <div className="chart-container">
                    <div className="chart-title">Clicks by Category</div>
                    <div className="chart-wrapper"><canvas id="categoriesChart"></canvas></div>
                  </div>
                </div>

                {affiliateData.top_products && (
                  <div className="table-container">
                    <div className="chart-title" style={{marginBottom: '15px'}}>All Products</div>
                    <table>
                      <thead>
                        <tr>
                          <th>Rank</th>
                          <th>Product</th>
                          <th>ASIN</th>
                          <th>Clicks</th>
                          <th>Amazon Link</th>
                        </tr>
                      </thead>
                      <tbody>
                        {affiliateData.top_products.map((product, idx) => (
                          <tr key={product.asin}>
                            <td><span className="rank-badge">{idx + 1}</span></td>
                            <td>{product.product_name}</td>
                            <td>{product.asin}</td>
                            <td>{product.click_count.toLocaleString()}</td>
                            <td>
                              <a
                                href={`https://www.amazon.com/dp/${product.asin}?tag=mdoutdoors1-20`}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="amazon-link"
                              >
                                View
                              </a>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </>
            ) : <div className="loading"><div className="spinner"></div></div>}
          </div>

          {/* Engagement Tab */}
          <div className={`tab-content ${activeTab === 'engagement' ? 'active' : ''}`}>
            {engagementData ? (
              <>
                <div className="kpi-row">
                  <div className="kpi-card">
                    <div className="kpi-label">Plans Created</div>
                    <div className="kpi-value">{engagementData.plans_created?.toLocaleString() || '—'}</div>
                  </div>
                  <div className="kpi-card">
                    <div className="kpi-label">Trips Planned</div>
                    <div className="kpi-value">{engagementData.trips_planned?.toLocaleString() || '—'}</div>
                  </div>
                  <div className="kpi-card">
                    <div className="kpi-label">Searches</div>
                    <div className="kpi-value">{engagementData.searches?.toLocaleString() || '—'}</div>
                  </div>
                  <div className="kpi-card">
                    <div className="kpi-label">Avg Events/Session</div>
                    <div className="kpi-value">{engagementData.avg_session_events?.toFixed(1) || '—'}</div>
                  </div>
                </div>

                <div className="charts-grid">
                  <div className="chart-container">
                    <div className="chart-title">Plans by Type</div>
                    <div className="chart-wrapper"><canvas id="plansChart"></canvas></div>
                  </div>
                  <div className="chart-container">
                    <div className="chart-title">Trips by Type</div>
                    <div className="chart-wrapper"><canvas id="tripsChart"></canvas></div>
                  </div>
                </div>
              </>
            ) : <div className="loading"><div className="spinner"></div></div>}
          </div>

          {/* Retention Tab */}
          <div className={`tab-content ${activeTab === 'retention' ? 'active' : ''}`}>
            {retentionData ? (
              <>
                <div className="kpi-row">
                  <div className="kpi-card">
                    <div className="kpi-label">New Devices Today</div>
                    <div className="kpi-value">{retentionData.new_devices_today?.toLocaleString() || '—'}</div>
                  </div>
                  <div className="kpi-card">
                    <div className="kpi-label">Returning Devices Today</div>
                    <div className="kpi-value">{retentionData.returning_devices_today?.toLocaleString() || '—'}</div>
                  </div>
                </div>

                <div className="charts-grid">
                  <div className="chart-container" style={{gridColumn: '1 / -1'}}>
                    <div className="chart-title">New vs Returning Devices (30 Days)</div>
                    <div className="chart-wrapper" style={{height: '300px'}}><canvas id="devicesChart"></canvas></div>
                  </div>
                  <div className="chart-container">
                    <div className="chart-title">Session Depth Distribution</div>
                    <div className="chart-wrapper"><canvas id="sessionChart"></canvas></div>
                  </div>
                </div>
              </>
            ) : <div className="loading"><div className="spinner"></div></div>}
          </div>

          {/* Errors Tab */}
          <div className={`tab-content ${activeTab === 'errors' ? 'active' : ''}`}>
            {errorData ? (
              <>
                <div className="kpi-row">
                  <div className="kpi-card">
                    <div className="kpi-label">Total Errors</div>
                    <div className="kpi-value">{errorData.total_errors?.toLocaleString() || '—'}</div>
                  </div>
                  <div className="kpi-card">
                    <div className="kpi-label">Errors Today</div>
                    <div className="kpi-value">{errorData.errors_today?.toLocaleString() || '—'}</div>
                  </div>
                </div>

                <div className="charts-grid">
                  <div className="chart-container" style={{gridColumn: '1 / -1'}}>
                    <div className="chart-title">Daily Errors (30 Days)</div>
                    <div className="chart-wrapper" style={{height: '300px'}}><canvas id="errorsChart"></canvas></div>
                  </div>
                </div>

                {errorData.top_errors && (
                  <div className="table-container">
                    <div className="chart-title" style={{marginBottom: '15px'}}>Top 20 Errors</div>
                    <table>
                      <thead>
                        <tr>
                          <th>Error Message</th>
                          <th>Context</th>
                          <th>Count</th>
                          <th>Last Seen</th>
                        </tr>
                      </thead>
                      <tbody>
                        {errorData.top_errors.map((err, idx) => (
                          <tr key={idx}>
                            <td style={{fontSize: '12px'}}>{err.error_message}</td>
                            <td style={{fontSize: '12px'}}>{err.error_context}</td>
                            <td>{err.count.toLocaleString()}</td>
                            <td>{err.last_seen}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </>
            ) : <div className="loading"><div className="spinner"></div></div>}
          </div>

          {/* Downloads Tab */}
          <div className={`tab-content ${activeTab === 'downloads' ? 'active' : ''}`}>
            <div className="import-section">
              <h3>Import App Store Connect CSV</h3>
              <textarea
                id="csvInput"
                placeholder="Paste App Store Connect CSV data here (Date, Units Sold, Revenue, etc.)"
              ></textarea>
              <div className="button-group">
                <button onClick={() => {
                  const csv = document.getElementById('csvInput').value;
                  if (csv) {
                    // Parse CSV and POST to backend
                    console.log('CSV data to upload:', csv);
                    alert('CSV parsing would happen here. Implement backend endpoint.');
                  }
                }}>
                  Parse & Upload CSV
                </button>
              </div>
            </div>

            <div className="import-section">
              <h3>Manual Entry</h3>
              <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '10px', marginBottom: '10px'}}>
                <input type="date" id="dlDate" placeholder="Date" style={{padding: '8px 12px', background: '#1a1e16', border: '1px solid #4a6741', color: '#c4a882', borderRadius: '4px'}} />
                <input type="number" id="dlCount" placeholder="Downloads" style={{padding: '8px 12px', background: '#1a1e16', border: '1px solid #4a6741', color: '#c4a882', borderRadius: '4px'}} />
                <input type="text" id="dlSource" placeholder="Source (App Store, Beta, etc.)" style={{padding: '8px 12px', background: '#1a1e16', border: '1px solid #4a6741', color: '#c4a882', borderRadius: '4px'}} />
              </div>
              <button onClick={() => alert('Manual download entry would POST here.')}>Add Download Record</button>
            </div>

            <div className="table-container">
              <div className="chart-title" style={{marginBottom: '15px'}}>Recent Downloads</div>
              <table>
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Downloads</th>
                    <th>Source</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>2026-04-11</td>
                    <td>45</td>
                    <td>App Store</td>
                  </tr>
                  <tr>
                    <td>2026-04-10</td>
                    <td>38</td>
                    <td>App Store</td>
                  </tr>
                  <tr>
                    <td>2026-04-09</td>
                    <td>52</td>
                    <td>TestFlight</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Dashboard />);
  </script>
</body>
</html>
