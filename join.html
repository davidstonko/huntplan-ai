<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDHuntFishOutdoors - Camp Invite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #ffffff;
        }

        .message {
            font-size: 16px;
            color: #b0b0b0;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .status {
            font-size: 14px;
            color: #d4af37;
            margin-bottom: 24px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .button {
            padding: 16px 24px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .button-primary {
            background-color: #d4af37;
            color: #1a1a1a;
        }

        .button-primary:hover {
            background-color: #e5c158;
            transform: translateY(-2px);
        }

        .button-secondary {
            background-color: #333333;
            color: #ffffff;
            border: 1px solid #555555;
        }

        .button-secondary:hover {
            background-color: #444444;
            border-color: #d4af37;
        }

        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: #777777;
        }

        .disclaimer {
            font-size: 11px;
            color: #666666;
            margin-top: 16px;
            line-height: 1.4;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #555555;
            border-top-color: #d4af37;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 20px;
            }

            .message {
                font-size: 14px;
            }

            .button {
                padding: 14px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🦌</div>
        <h1>MDHuntFishOutdoors</h1>
        <p class="message">You've been invited to join a camp!</p>

        <div id="loading" class="status">
            <span class="spinner"></span>Opening app...
        </div>

        <div id="fallback" class="hidden">
            <p class="message">MDHuntFishOutdoors not found on this device.</p>
            <div class="button-group">
                <a href="https://apps.apple.com/app/id6761347484" class="button button-primary">
                    Get MDHuntFishOutdoors
                </a>
                <a href="#" onclick="history.back(); return false;" class="button button-secondary">
                    Go Back
                </a>
            </div>
        </div>

        <div class="footer">
            <p>A Maryland outdoor recreation app</p>
            <div class="disclaimer">
                Always verify regulations with Maryland DNR
            </div>
        </div>
    </div>

    <script>
        // Extract camp parameter from URL
        function getCampIdFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('camp') || null;
        }

        // Attempt to open app via custom URL scheme
        function openApp() {
            const campId = getCampIdFromUrl();
            if (!campId) {
                console.warn('No camp ID in URL');
                showFallback();
                return;
            }

            // Construct custom URL scheme
            const customUrl = `huntmaryland://join/${campId}`;

            // Track if app opened
            let appOpened = false;

            // Try to open the app
            window.location.href = customUrl;

            // After 1500ms, if app didn't open, show fallback
            setTimeout(() => {
                if (!appOpened && document.hidden === false) {
                    showFallback();
                }
            }, 1500);

            // Listen for visibility change to detect if app opened
            const handleVisibilityChange = () => {
                if (document.hidden) {
                    appOpened = true;
                }
                document.removeEventListener('visibilitychange', handleVisibilityChange);
            };

            document.addEventListener('visibilitychange', handleVisibilityChange);
        }

        // Show fallback to App Store
        function showFallback() {
            const loadingDiv = document.getElementById('loading');
            const fallbackDiv = document.getElementById('fallback');

            loadingDiv.classList.add('hidden');
            fallbackDiv.classList.remove('hidden');
        }

        // Start the process when page loads
        document.addEventListener('DOMContentLoaded', openApp);

        // Also try immediately
        openApp();
    </script>
</body>
</html>
