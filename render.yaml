# Render Blueprint — Infrastructure-as-Code deployment
# Deploy with: https://render.com/deploy → connect this repo
# Or create services manually matching this spec
#
# 2026-09 OUTAGE NOTE: production went down because Render suspends free-tier
# Postgres when the trial ends and then deletes it. The API failed init_db() on
# boot and uvicorn exited with status 3. Two changes came out of that: the API
# now boots in degraded mode instead of exiting when the database is
# unreachable, and the database moved to a paid plan (see below).
#
# If this service was created by hand in the dashboard rather than from this
# blueprint, editing this file changes nothing on Render. The two settings that
# matter — the build filter and DATABASE_URL — must then be set in the
# dashboard as well. backend/RUNBOOK_RENDER.md has both paths.

# Postgres is a PAID Render database, on purpose (decision 2026-09-27: one
# vendor, one bill, one dashboard). The database that went away on 2026-07-11
# was on the `free` plan, which is a trial: Render suspends it when the trial
# ends and deletes it 14 days later. A paid plan is not subject to that, and
# includes daily backups. Never set this back to `free`.
databases:
  - name: huntplan-db
    databaseName: huntplan
    plan: basic-256mb        # cheapest persistent tier; includes daily backups
    postgresMajorVersion: "16"
    # MUST match the web service's region. Two Render resources can only reach
    # each other over the private network when they are in the same region; a
    # mismatch silently falls back to the public internet or fails outright.
    # huntplan-api has been in oregon since it was created.
    region: oregon
    ipAllowList: []          # Render-internal access only

services:
  - type: web
    name: huntplan-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    region: oregon  # where this service already lives; pinned so a sync cannot move it
    # Was `free`: free web services spin down after 15 min idle, so the first
    # request from the phone app waited ~30-60 s for a cold start (and every
    # cold start re-runs init_db). starter keeps the instance warm.
    plan: starter
    healthCheckPath: /health  # always 200; body reports db "ok"|"unavailable"
    # 2026-09 NOTE: without this filter Render rebuilt the API on every push,
    # including React-Native-only commits that touch nothing the image
    # contains. Each of those rebuilds produced a "deploy failed for
    # huntplan-api" email for a change that was never deployable. Only paths
    # that actually end up in the Docker context should trigger a deploy.
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: huntplan-db
          property: connectionString
        # Render hands over the INTERNAL connection string: no public
        # internet hop, no TLS parameters to translate. app/config.py rewrites
        # postgres:// to postgresql+asyncpg:// at startup, and also handles a
        # libpq string from an external provider should this ever move
        # (see backend/tests/test_database_url_normalization.py).
        # While this is unset the API still boots and serves 200s with
        # "db":"unavailable" — degraded mode, not a crash.
      - key: SECRET_KEY
        generateValue: true
      # The AI planner tries Claude FIRST and only falls back to Gemini when
      # ANTHROPIC_API_KEY is unset (see ai_planner/service.py). Decision
      # 2026-09-27: use Gemini, whose free tier costs nothing, so leave
      # ANTHROPIC_API_KEY EMPTY. Setting it silently moves every question
      # onto a metered API.
      - key: GEMINI_API_KEY
        sync: false  # Set manually: aistudio.google.com/apikey
      - key: ANTHROPIC_API_KEY
        sync: false  # Leave blank unless deliberately switching to Claude
      - key: MAPBOX_ACCESS_TOKEN
        sync: false  # Set manually in Render dashboard
      - key: DEBUG
        value: "false"
      - key: REDIS_URL
        value: "redis://localhost:6379/0"  # Redis not provisioned; Celery unused in prod
