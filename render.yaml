# Render Blueprint — Infrastructure-as-Code deployment
# Deploy with: https://render.com/deploy → connect this repo
# Or create services manually matching this spec
#
# 2026-09 OUTAGE NOTE: production went down because Render suspends free-tier
# Postgres when the trial ends and then deletes it. The API failed init_db() on
# boot and uvicorn exited with status 3. Two changes came out of that: the API
# now boots in degraded mode instead of exiting when the database is
# unreachable, and Postgres moved off Render entirely (see below).
#
# If this service was created by hand in the dashboard rather than from this
# blueprint, editing this file changes nothing on Render. The two settings that
# matter — the build filter and DATABASE_URL — must then be set in the
# dashboard as well. backend/RUNBOOK_RENDER.md has both paths.

# Postgres lives OUTSIDE Render. The free Render Postgres that used to back
# this service (huntplan-db) was suspended 2026-07-11 and then deleted, which
# is what took production down: DATABASE_URL kept pointing at a hostname that
# no longer resolves ("Name or service not known"). Render's free Postgres
# always ends this way, so the replacement is a provider whose free tier does
# not expire — Neon. Set DATABASE_URL manually in the Render dashboard to the
# Neon connection string (see backend/RUNBOOK_RENDER.md).
#
# To go all-Render on a paid database instead, uncomment this block, change
# DATABASE_URL below back to `fromDatabase`, and expect ~$6/mo:
#
# databases:
#   - name: huntplan-db
#     databaseName: huntplan
#     plan: basic-256mb        # cheapest persistent tier; free is deleted
#     postgresMajorVersion: "16"
#     ipAllowList: []          # Render-internal access only

services:
  - type: web
    name: huntplan-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    # Was `free`: free web services spin down after 15 min idle, so the first
    # request from the phone app waited ~30-60 s for a cold start (and every
    # cold start re-runs init_db). starter keeps the instance warm.
    plan: starter
    healthCheckPath: /health  # always 200; body reports db "ok"|"unavailable"
    # 2026-09 NOTE: without this filter Render rebuilt the API on every push,
    # including React-Native-only commits that touch nothing the image
    # contains. Each of those rebuilds produced a "deploy failed for
    # huntplan-api" email for a change that was never deployable. Only paths
    # that actually end up in the Docker context should trigger a deploy.
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: DATABASE_URL
        sync: false  # Paste the Neon connection string in the dashboard.
        # Either scheme works: app/config.py rewrites postgres:// to
        # postgresql+asyncpg:// at startup. Neon requires TLS, so keep the
        # ?sslmode=require that Neon's string already carries.
        # Until this is set the API still boots and serves 200s with
        # "db":"unavailable" (degraded mode) — the app's offline features and
        # the App Review walkthrough do not depend on it.
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: MAPBOX_ACCESS_TOKEN
        sync: false  # Set manually in Render dashboard
      - key: DEBUG
        value: "false"
      - key: REDIS_URL
        value: "redis://localhost:6379/0"  # Redis not provisioned; Celery unused in prod
